version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: genai_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-genai_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme123}
      POSTGRES_DB: genai_stack
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-genai_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - genai_network

  # ChromaDB Vector Database
  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: genai_chroma
    environment:
      CHROMA_DB_IMPL: duckdb+parquet
      PERSIST_DIRECTORY: /chroma/data
      ANONYMIZED_TELEMETRY: "false"
    volumes:
      - chroma_data:/chroma/data
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - genai_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genai_backend
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-genai_user}:${DB_PASSWORD:-changeme123}@postgres:5432/genai_stack
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY}
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      PYTHONUNBUFFERED: 1
      LOG_LEVEL: info
    volumes:
      - ./backend/uploaded_files:/app/uploaded_files
      - ./backend/chroma_db_gemini:/app/chroma_db_gemini
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - genai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: genai_frontend
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - genai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: genai_nginx
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    networks:
      - genai_network

volumes:
  postgres_data:
    driver: local
  chroma_data:
    driver: local

networks:
  genai_network:
    driver: bridge
